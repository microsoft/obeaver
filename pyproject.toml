[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "obeaver"
version = "0.1.0"
description = "LLM inference server powered by ONNX Runtime GenAI (CPU-first, cross-platform)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["llm", "onnxruntime", "inference", "openai", "chat"]

dependencies = [
    "onnxruntime-genai>=0.6.0",
    "onnxruntime>=1.18.0",
    "onnx_ir",
    "transformers>=4.40.0",
    "foundry-local-sdk>=0.5.0",
    "openai>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyfiglet>=1.0.2",
    "huggingface-hub>=0.23.0",
    "numpy>=1.24.0",
    "torch>=2.10.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
obeaver = "obeaver.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["obeaver*"]
